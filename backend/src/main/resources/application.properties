spring.datasource.url=jdbc:mysql://localhost:3306/pixora_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

server.port=8080

app.jwt.secret=pixoraSecretKey2024VeryLongSecretForHS256AlgorithmPixoraApp
app.jwt.expiration=86400000

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/

logging.level.com.pixora=INFO
